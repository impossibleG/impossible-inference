[workspace]
members = [
    "crates/impossible-inferences-artifacts",
    "crates/impossible-inferences-domain",
    "crates/impossible-inferences-protocol",
    "crates/impossible-inferences-engine",
    "crates/impossible-inferences-server",
]
exclude = ["vendor/impossible-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { version = "=0.8.6", features = ["http1", "json", "tokio", "ws"] }
clap = { version = "=4.5.50", features = ["derive", "env"] }
flate2 = "=1.1.9"
fs2 = "=0.4.3"
http-body-util = "=0.1.3"
impossible-inferences-artifacts = { version = "=0.1.0", path = "crates/impossible-inferences-artifacts" }
impossible-inferences-domain = { version = "=0.1.0", path = "crates/impossible-inferences-domain" }
impossible-inferences-protocol = { version = "=0.1.0", path = "crates/impossible-inferences-protocol" }
impossible-inferences-engine = { version = "=0.1.0", path = "crates/impossible-inferences-engine" }
impossible-server-core = { version = "=0.1.0", path = "vendor/impossible-server/crates/impossible-server-core" }
impossible-server-testkit = { version = "=0.1.0", path = "vendor/impossible-server/crates/impossible-server-testkit" }
futures-util = "=0.3.34"
getrandom = "=0.3.4"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
prost = "=0.14.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tar = "=0.4.46"
tokio = "=1.48.0"
tokio-stream = { version = "=0.1.17", features = ["net"] }
tokio-tungstenite = "=0.28.0"
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-health = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-reflection = "=0.14.6"
tower = { version = "=0.5.2", features = ["util"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
