[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
confidence-threshold = 0.93
include-dev = true
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # rustls uses ISC-licensed cryptographic and certificate-validation components.
    "ISC",
    "MIT",
    "Unicode-3.0",
    # zlib-rs backs the reviewed archive decoder.
    "Zlib",
    # Mozilla's root-certificate data consumed by webpki-roots uses this license.
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = [
    # ring remains on getrandom 0.2 while the engine directly uses the current 0.3 OS API.
    { name = "getrandom", version = "=0.2.17" },
    # displaydoc and ICU have moved to syn 3 while the remaining proc-macro graph uses syn 2.
    { name = "syn", version = "=3.0.6" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
